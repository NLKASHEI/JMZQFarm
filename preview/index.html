<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小农场 4.3 · 秋日成就册预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101217;color:#eeeae4;font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif}header{max-width:1160px;margin:14px auto;padding:0 14px}h1{font-size:18px;margin:0 0 5px}p{margin:0;color:#b0b4bd;font-size:12px}.tools{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}button,select{font:inherit;color:#eeeae4;background:#252b35;border:1px solid #414751;border-radius:8px;padding:7px 12px;cursor:pointer}button.active{color:#edbc8e;border-color:#dda777}iframe{display:block;margin:auto;border:1px solid #414751;border-radius:12px;width:min(1160px,100%);height:calc(100dvh - 182px);min-height:430px;background:#101217}details{max-width:1160px;margin:12px auto;padding:0 14px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1d222b;border-radius:8px;padding:12px;max-height:320px;overflow:auto}summary{cursor:pointer;color:#dda777}
</style></head><body>
<header><h1>小农场 4.3 · 秋日成就册预览</h1><p>可点击场景 · 紧凑格子 · 可拖动导航。追鱼、离线值守与实体奖励保留；独立模拟存档。</p>
<div class="tools"><button data-width="1160" class="active">宽屏</button><button data-width="720">平板 720</button><button data-width="390">手机 390</button><button data-width="320">窄屏 320</button><label>模拟写入 <select id="mode"><option value="ok">正常</option><option value="fail">写入前失败</option><option value="after">已写入但回执报错</option><option value="mvu">MVU 正在解析</option></select></label></div></header>
<iframe title="小农场预览场景" src="scene.html?v=4.3.2"></iframe>
<details><summary>查看模拟角色背包（装箱后即时更新）</summary><pre id="bag">等待场景加载…</pre></details>
<script>
const frame=document.querySelector('iframe');
document.querySelectorAll('[data-width]').forEach(b=>b.addEventListener('click',()=>{frame.style.width='min('+b.dataset.width+'px,100%)';document.querySelectorAll('[data-width]').forEach(x=>x.classList.toggle('active',x===b));}));
document.querySelector('#mode').addEventListener('change',e=>frame.contentWindow.postMessage({type:'farm-preview-mode',mode:e.target.value},location.origin));
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==frame.contentWindow||e.data?.type!=='farm-preview-bag')return;document.querySelector('#bag').textContent=JSON.stringify(e.data.variables.stat_data.物品,null,2);});
</script></body></html>
